name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      attest-tag:
        description: Attest the files of this existing release (e.g. 1.2.3) instead of releasing
        required: false
        default: ''

# Never run two releases at once; a newer push waits for the current one to finish.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: inputs.attest-tag == ''
    # The widget targets net472 and uses WPF/System.Drawing, so build on Windows.
    runs-on: windows-latest
    permissions:
      contents: write       # create tags and GitHub Releases, upload the zip and installer
      issues: write         # comment on issues fixed by a release
      pull-requests: write  # comment on PRs included in a release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # semantic-release needs the full history and tags
          persist-credentials: false  # semantic-release pushes tags with GITHUB_TOKEN itself

      # No dependency cache: a poisoned cache must not reach the release job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - run: dotnet test tests/WigiPanel.Tests -c Release

      # package.ps1 -Installer needs Inno Setup 6 and fails in CI without it. Install it if the
      # runner image doesn't ship it.
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Builds against stubs/WigiDashWidgetFramework, since WigiDash Manager isn't installed here.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release tags HEAD when it cuts a release; empty when there was nothing to release.
      - name: Find release tag
        id: tag
        shell: pwsh
        run: |
          $tag = git tag --points-at HEAD | Where-Object { $_ -match '^\d+\.\d+\.\d+$' } | Select-Object -First 1
          "tag=$tag" >> $env:GITHUB_OUTPUT

  # Signed SLSA build provenance for the published release files, checkable with
  # `gh attestation verify`. A separate job so only these steps (no npm, NuGet or semantic-release
  # code) can mint an OIDC token, and so it can be re-run alone if attesting fails. It attests the
  # files as downloaded from the release, i.e. exactly what users get.
  attest:
    needs: release
    if: >-
      always() &&
      (inputs.attest-tag != '' || (needs.release.result == 'success' && needs.release.outputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write    # download the draft's assets, attach the provenance file, publish the draft
      id-token: write    # Sigstore signing certificate
      attestations: write
    steps:
      - name: Download release files
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.attest-tag || needs.release.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.zip' --pattern '*.exe'
          ls -l dist
          echo "draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" >> "$GITHUB_OUTPUT"

      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe

      # semantic-release creates the release as a draft (draftRelease in .releaserc.json) because
      # releases are immutable once published. Attach the provenance as <name>.intoto.jsonl (one
      # Sigstore bundle per line, the format `gh attestation download` writes and
      # `gh attestation verify --bundle` reads), then publish. If anything above fails, the release
      # stays an unpublished draft and this job can be re-run. Already-published releases (manual
      # attest-tag runs) can't take new assets, so they only get the attestation.
      - name: Attach provenance and publish
        if: steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.attest-tag || needs.release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          provenance="wigidash-panel-$TAG.intoto.jsonl"
          jq -c . "$BUNDLE" > "$provenance"
          gh release upload "$TAG" "$provenance" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
