name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases at once; a newer push waits for the current one to finish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # create tags and GitHub Releases, upload the zip
  issues: write         # comment on issues fixed by a release
  pull-requests: write  # comment on PRs included in a release

jobs:
  release:
    # The widget targets net472 and uses WPF/System.Drawing, so build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # semantic-release needs the full history and tags

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      # Builds against stubs/WigiDashWidgetFramework, since WigiDash Manager isn't installed here.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
