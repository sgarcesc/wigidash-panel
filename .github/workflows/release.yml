name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases at once; a newer push waits for the current one to finish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # create tags and GitHub Releases, upload the zip
  issues: write         # comment on issues fixed by a release
  pull-requests: write  # comment on PRs included in a release

jobs:
  release:
    # The widget targets net472 and uses WPF/System.Drawing, so build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # semantic-release needs the full history and tags
          persist-credentials: false  # semantic-release pushes tags with GITHUB_TOKEN itself

      # No dependency cache: a poisoned cache must not reach the release job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - run: dotnet test tests/WigiPanel.Tests -c Release

      # package.ps1 -Installer needs Inno Setup 6 and fails in CI without it. Install it if the
      # runner image doesn't ship it.
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Builds against stubs/WigiDashWidgetFramework, since WigiDash Manager isn't installed here.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
